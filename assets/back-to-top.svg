<svg xmlns="http://www.w3.org/2000/svg" width="220" height="52" viewBox="0 0 220 52" role="img" aria-label="Back to top">
<title>Back to top</title>
<style>
@font-face{font-family:'d6';src:url(data:font/woff2;base64,) format('woff2');}
.d6{font-family:'d6','Space Grotesk',system-ui,sans-serif;font-weight:normal;}
@font-face{font-family:'m4';src:url(data:font/woff2;base64,) format('woff2');}
.m4{font-family:'m4','JetBrains Mono',ui-monospace,monospace;font-weight:normal;}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.rise{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes up{0%,100%{transform:translateY(2px)}50%{transform:translateY(-3px)}}
.up{animation:up 1.6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important;}}
</style>
<defs></defs>
<rect x="0.5" y="0.5" width="219" height="51" rx="25.5" fill="#161b22" stroke="#58a6ff" stroke-opacity=".55"/>
<circle cx="30" cy="26" r="14" fill="#58a6ff" fill-opacity=".15"/>
<g class="up"><path d="M30 33V20M24 26l6-6 6 6" fill="none" stroke="#58a6ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="56" y="32" class="d6 " font-size="17" fill="#e6edf3" text-anchor="start">Back to top</text>
<text x="198" y="31" class="m4 " font-size="12.5" fill="#6e7681" text-anchor="end">#top</text>
</svg>