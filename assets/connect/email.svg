<svg xmlns="http://www.w3.org/2000/svg" width="200" height="224" viewBox="0 0 200 224" role="img" aria-label="Email: say hello">
<title>Email: say hello</title>
<style>
@font-face{font-family:'d7';src:url(data:font/woff2;base64,) format('woff2');}
.d7{font-family:'d7','Space Grotesk',system-ui,sans-serif;font-weight:normal;}
@font-face{font-family:'m4';src:url(data:font/woff2;base64,) format('woff2');}
.m4{font-family:'m4','JetBrains Mono',ui-monospace,monospace;font-weight:normal;}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.rise{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.1s cubic-bezier(.2,.8,.2,1) both}
@media (prefers-reduced-motion:reduce){*{animation:none!important;}}
</style>
