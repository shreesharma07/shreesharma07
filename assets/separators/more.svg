<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="120" viewBox="0 0 1200 120" role="img" aria-label="MORE ABOUT ME: experience · projects · skills · impact · timeline · credentials">
<title>MORE ABOUT ME: experience · projects · skills · impact · timeline · credentials</title>
<style>
@font-face{font-family:'m6';src:url(data:font/woff2;base64,) format('woff2');}
.m6{font-family:'m6','JetBrains Mono',ui-monospace,monospace;font-weight:normal;}
@font-face{font-family:'m4';src:url(data:font/woff2;base64,) format('woff2');}
.m4{font-family:'m4','JetBrains Mono',ui-monospace,monospace;font-weight:normal;}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.rise{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes flow{to{stroke-dashoffset:-48}}
.flow{animation:flow 2.4s linear infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important;}}
</style>
<defs><linearGradient id="fl" x1="0" x2="1"><stop offset="0" stop-color="#a371f7" stop-opacity="0"/><stop offset="1" stop-color="#a371f7"/></linearGradient><linearGradient id="fr" x1="0" x2="1"><stop offset="0" stop-color="#a371f7"/><stop offset="1" stop-color="#a371f7" stop-opacity="0"/></linearGradient></defs>
<path class="flow" d="M0 54H497.4" stroke="url(#fl)" stroke-width="2" stroke-dasharray="14 10"/>
<path class="flow" d="M1200 54H702.5999999999999" stroke="url(#fr)" stroke-width="2" stroke-dasharray="14 10"/>
<rect x="517.4" y="33" width="165.2" height="42" rx="21" fill="#161b22" stroke="#a371f7" stroke-opacity=".6"/>
<circle cx="539.4" cy="54" r="4" fill="#a371f7" style="animation:pulse 1.8s ease-in-out infinite"/>
<text x="553.4" y="59" class="m6 " font-size="14" fill="#e6edf3" text-anchor="start">MORE ABOUT ME</text>
<text x="600" y="104" class="m4 " font-size="13" fill="#6e7681" text-anchor="middle">experience · projects · skills · impact · timeline · credentials</text>
</svg>