<svg xmlns="http://www.w3.org/2000/svg" width="590" height="150" viewBox="0 0 590 150" role="img" aria-label="Bachelor of Computer Applications, Guru Gobind Singh Indraprastha University">
<title>Bachelor of Computer Applications, Guru Gobind Singh Indraprastha University</title>
<style>
@font-face{font-family:'m6';src:url(data:font/woff2;base64,) format('woff2');}
.m6{font-family:'m6','JetBrains Mono',ui-monospace,monospace;font-weight:normal;}
@font-face{font-family:'d7';src:url(data:font/woff2;base64,) format('woff2');}
.d7{font-family:'d7','Space Grotesk',system-ui,sans-serif;font-weight:normal;}
@font-face{font-family:'d5';src:url(data:font/woff2;base64,) format('woff2');}
.d5{font-family:'d5','Space Grotesk',system-ui,sans-serif;font-weight:normal;}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.rise{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.1s cubic-bezier(.2,.8,.2,1) both}
@media (prefers-reduced-motion:reduce){*{animation:none!important;}}
</style>
<defs></defs>
<rect x="0.5" y="0.5" width="589" height="149" rx="16" fill="#0d1117" stroke="#30363d"/>
<rect x="28" y="26" width="114" height="28" rx="14" fill="#e3b341" fill-opacity=".12" stroke="#e3b341" stroke-opacity=".55"/>
<text x="85" y="44.5" class="m6 " font-size="12.5" fill="#e3b341" text-anchor="middle">2017 to 2020</text>
<text x="28" y="92" class="d7 " font-size="22" fill="#e6edf3" text-anchor="start">Bachelor of Computer Applications</text>
<text x="28" y="122" class="d5 " font-size="15" fill="#8b949e" text-anchor="start">Guru Gobind Singh Indraprastha University · New Delhi</text>
