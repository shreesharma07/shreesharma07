name: Generate 3D contribution calendar

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Generate 3D contribution city
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.ACT_GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          # Three-colour palette (slate, blue, violet) matching the README theme
          SETTING_JSON: .github/profile-3d-settings.json

      - name: Commit the generated SVG
        run: |
          # The action always writes to ./profile-3d-contrib. The README only uses the
          # city render, so move that into assets/ and drop the rest of the output.
          mkdir -p assets/profile-3d-contrib
          mv profile-3d-contrib/profile-city.svg assets/profile-3d-contrib/profile-city.svg
          rm -rf profile-3d-contrib
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A assets/profile-3d-contrib
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh 3D contribution calendar"
          git pull --rebase
          git push
