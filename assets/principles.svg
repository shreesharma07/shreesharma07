<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="168" viewBox="0 0 1200 168" role="img" aria-label="How I work">
<title>How I work</title>
<style>
@font-face{font-family:'d6';src:url(data:font/woff2;base64,) format('woff2');}
.d6{font-family:'d6','Space Grotesk',system-ui,sans-serif;font-weight:normal;}
@font-face{font-family:'d5';src:url(data:font/woff2;base64,) format('woff2');}
.d5{font-family:'d5','Space Grotesk',system-ui,sans-serif;font-weight:normal;}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.rise{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.1s cubic-bezier(.2,.8,.2,1) both}
@media (prefers-reduced-motion:reduce){*{animation:none!important;}}
</style>
<defs></defs>
<g class="rise" style="animation-delay:0s">
<rect x="0.5" y="0.5" width="284" height="167" rx="16" fill="#0d1117" stroke="#30363d"/>
<rect x="28" y="28" width="28" height="4" rx="2" fill="#58a6ff"/>
<text x="28" y="70" class="d6 " font-size="20" fill="#e6edf3" text-anchor="start">Own the full backend</text>
<text x="28" y="102" class="d5 " font-size="15" fill="#8b949e" text-anchor="start">Schema, APIs, queues, sockets,</text>
<text x="28" y="123.75" class="d5 " font-size="15" fill="#8b949e" text-anchor="start">deploys and monitoring,</text>
<text x="28" y="145.5" class="d5 " font-size="15" fill="#8b949e" text-anchor="start">design to on-call.</text>
</g>
<g class="rise" style="animation-delay:0.1s">
<rect x="305.5" y="0.5" width="284" height="167" rx="16" fill="#0d1117" stroke="#30363d"/>
<rect x="333" y="28" width="28" height="4" rx="2" fill="#a371f7"/>
<text x="333" y="70" class="d6 " font-size="20" fill="#e6edf3" text-anchor="start">Design with the client</text>
<text x="333" y="102" class="d5 " font-size="15" fill="#8b949e" text-anchor="start">Feature scope and high-level</text>
<text x="333" y="123.75" class="d5 " font-size="15" fill="#8b949e" text-anchor="start">design agreed before the build</text>
<text x="333" y="145.5" class="d5 " font-size="15" fill="#8b949e" text-anchor="start">starts.</text>
</g>
<g class="rise" style="animation-delay:0.2s">
<rect x="610.5" y="0.5" width="284" height="167" rx="16" fill="#0d1117" stroke="#30363d"/>
<rect x="638" y="28" width="28" height="4" rx="2" fill="#3fb950"/>
<text x="638" y="70" class="d6 " font-size="20" fill="#e6edf3" text-anchor="start">Prove it with a POC</text>
<text x="638" y="102" class="d5 " font-size="15" fill="#8b949e" text-anchor="start">Approach, cost and failure</text>
<text x="638" y="123.75" class="d5 " font-size="15" fill="#8b949e" text-anchor="start">modes settled before</text>
<text x="638" y="145.5" class="d5 " font-size="15" fill="#8b949e" text-anchor="start">committing.</text>
</g>
<g class="rise" style="animation-delay:0.30000000000000004s">
<rect x="915.5" y="0.5" width="284" height="167" rx="16" fill="#0d1117" stroke="#30363d"/>
<rect x="943" y="28" width="28" height="4" rx="2" fill="#f0883e"/>
<text x="943" y="70" class="d6 " font-size="20" fill="#e6edf3" text-anchor="start">Write it down</text>
<text x="943" y="102" class="d5 " font-size="15" fill="#8b949e" text-anchor="start">Scope, effort and trade-offs in</text>
<text x="943" y="123.75" class="d5 " font-size="15" fill="#8b949e" text-anchor="start">writing; architecture in</text>
<text x="943" y="145.5" class="d5 " font-size="15" fill="#8b949e" text-anchor="start">Mermaid.</text>
</g>
</svg>