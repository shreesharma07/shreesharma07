<g class="rise" style="animation-delay:0.30000000000000004s"><rect x="379.1666666666667" y="176.5" width="172.33333333333334" height="79" rx="12" fill="none" stroke="#30363d"/>
<text x="396.6666666666667" y="214" class="d7 " font-size="26" fill="#f0883e" text-anchor="start">↑</text>
