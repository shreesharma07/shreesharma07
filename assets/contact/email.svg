<svg xmlns="http://www.w3.org/2000/svg" width="300" height="72" viewBox="0 0 300 72" role="img" aria-label="Email: say hello">
<title>Email: say hello</title>
<style>
@font-face{font-family:'d7';src:url(data:font/woff2;base64,) format('woff2');}
.d7{font-family:'d7','Space Grotesk',system-ui,sans-serif;font-weight:normal;}
@font-face{font-family:'m4';src:url(data:font/woff2;base64,) format('woff2');}
.m4{font-family:'m4','JetBrains Mono',ui-monospace,monospace;font-weight:normal;}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.rise{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes shine{0%{transform:translateX(-140px)}55%,100%{transform:translateX(440px)}}
@keyframes ring{0%{transform:scale(1);opacity:.55}100%{transform:scale(1.55);opacity:0}}
.shine{animation:shine 3.6s ease-in-out 0.90s infinite}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 2.2s ease-out 0.60s infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important;}}
</style>
<defs><clipPath id="bc"><rect width="300" height="72" rx="14"/></clipPath><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".16"/><stop offset="1" stop-color="#000000" stop-opacity=".18"/></linearGradient><linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".28"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient></defs>
<g clip-path="url(#bc)"><rect width="300" height="72" fill="#da3633"/><rect width="300" height="72" fill="url(#bg)"/><rect class="shine" x="0" y="-20" width="90" height="112" fill="url(#sh)" transform="skewX(-18)"/></g>
<circle class="ring" cx="40" cy="36" r="21" fill="none" stroke="#ffffff" stroke-width="2"/>
<circle cx="40" cy="36" r="21" fill="#ffffff" fill-opacity=".16"/>
<g transform="translate(29 25) scale(0.9166666666666666)"><path d="M24 5.457v13.909c0 .904-.732 1.636-1.636 1.636h-3.819V11.73L12 16.64l-6.545-4.91v9.273H1.636A1.636 1.636 0 0 1 0 19.366V5.457c0-2.023 2.309-3.178 3.927-1.964L5.455 4.64 12 9.548l6.545-4.91 1.528-1.145C21.69 2.28 24 3.434 24 5.457z" fill="#ffffff"/></g>
<text x="76" y="33" class="d7 " font-size="18" fill="#ffffff" text-anchor="start">Email</text>
<text x="76" y="53" class="m4 " font-size="12.5" fill="#ffffff" text-anchor="start" style="opacity:.82">say hello</text>
</svg>