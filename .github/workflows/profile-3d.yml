name: Generate 3D contribution calendar

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Generate 3D calendar SVGs
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit the generated SVGs
        run: |
          # The README only uses the night-rainbow variant; drop the other nine.
          find profile-3d-contrib -type f ! -name profile-night-rainbow.svg -delete
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A profile-3d-contrib
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh 3D contribution calendar"
          git pull --rebase
          git push
