<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="BEFORE YOU GO: thanks for reading this far. Back to top">
<title>BEFORE YOU GO: thanks for reading this far. Back to top</title>
<style>
@font-face{font-family:'m6';src:url(data:font/woff2;base64,) format('woff2');}
.m6{font-family:'m6','JetBrains Mono',ui-monospace,monospace;font-weight:normal;}
@font-face{font-family:'d7';src:url(data:font/woff2;base64,) format('woff2');}
.d7{font-family:'d7','Space Grotesk',system-ui,sans-serif;font-weight:normal;}
@font-face{font-family:'d5';src:url(data:font/woff2;base64,) format('woff2');}
.d5{font-family:'d5','Space Grotesk',system-ui,sans-serif;font-weight:normal;}
@font-face{font-family:'m4';src:url(data:font/woff2;base64,) format('woff2');}
.m4{font-family:'m4','JetBrains Mono',ui-monospace,monospace;font-weight:normal;}
@font-face{font-family:'d6';src:url(data:font/woff2;base64,) format('woff2');}
.d6{font-family:'d6','Space Grotesk',system-ui,sans-serif;font-weight:normal;}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.rise{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes drift1{0%,100%{transform:translate(0,0)}50%{transform:translate(-50px,-30px)}}
@keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(60px,20px)}}
.o1{animation:drift1 16s ease-in-out infinite}.o2{animation:drift2 18s ease-in-out infinite}
@keyframes up{0%,100%{transform:translateY(3px)}50%{transform:translateY(-4px)}}
.up{animation:up 1.6s ease-in-out infinite}
@keyframes ring{0%{transform:scale(1);opacity:.6}100%{transform:scale(1.45);opacity:0}}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 2.4s ease-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important;}}
</style>
<defs><clipPath id="clip"><rect width="1200" height="260" rx="20"/></clipPath><radialGradient id="gk"><stop offset="0" stop-color="#f778ba" stop-opacity=".28"/><stop offset="1" stop-color="#f778ba" stop-opacity="0"/></radialGradient><radialGradient id="gb"><stop offset="0" stop-color="#1f6feb" stop-opacity=".35"/><stop offset="1" stop-color="#1f6feb" stop-opacity="0"/></radialGradient><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#30363d"/></pattern><linearGradient id="hl" x1="0" x2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#ffadda"/><stop offset="1" stop-color="#d2a8ff"/></linearGradient><linearGradient id="bar" x1="0" x2="1"><stop offset="0" stop-color="#58a6ff"/><stop offset=".5" stop-color="#a371f7"/><stop offset="1" stop-color="#f778ba"/></linearGradient></defs>
<g clip-path="url(#clip)">
<rect width="1200" height="260" fill="#0d1117"/>
<rect width="1200" height="260" fill="url(#dots)" opacity=".4"/>
<circle class="o1" cx="180" cy="260" r="280" fill="url(#gk)"/>
<circle class="o2" cx="1030" cy="40" r="260" fill="url(#gb)"/>
<rect y="255" width="1200" height="5" fill="url(#bar)"/>
</g>
<rect x="0.5" y="0.5" width="1199" height="259" rx="20" fill="none" stroke="#30363d"/>
<rect x="56" y="44" width="165.2" height="36" rx="18" fill="#161b22" stroke="#f778ba" stroke-opacity=".6"/>
<circle cx="78" cy="62" r="4" fill="#f778ba" style="animation:pulse 1.8s ease-in-out infinite"/>
<text x="92" y="67" class="m6 " font-size="14" fill="#e6edf3" text-anchor="start">BEFORE YOU GO</text>
<text x="56" y="138" class="d7 rise" font-size="42" fill="url(#hl)">Thanks for reading this far</text>
<text x="56" y="180" class="d5 " font-size="18" fill="#8b949e" text-anchor="start">That is the long version. If any of it resonates, my inbox is always open.</text>
<text x="56" y="218" class="m4 " font-size="13.5" xml:space="preserve"><tspan fill="#f778ba">$ </tspan><tspan fill="#e6edf3">echo EOF</tspan><tspan fill="#6e7681">   # 10 sections  ·  4 roles  ·  5+ years in production</tspan></text>
<path d="M860 44V216" stroke="#21262d"/>
<circle class="ring" cx="1030" cy="100" r="40" fill="none" stroke="#58a6ff" stroke-width="1.5"/>
<circle cx="1030" cy="100" r="40" fill="#58a6ff" fill-opacity=".14" stroke="#58a6ff" stroke-opacity=".7"/>
<g class="up"><path d="M1030 114V87M1018 99l12-12 12 12" fill="none" stroke="#58a6ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="1030" y="178" class="d6 " font-size="20" fill="#e6edf3" text-anchor="middle">Back to top</text>
<text x="1030" y="204" class="m4 " font-size="12.5" fill="#6e7681" text-anchor="middle">cd ~  ·  #top</text>
</svg>