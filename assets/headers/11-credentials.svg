<text x="83.6" y="94" class="d7 rise" font-size="30" fill="#e6edf3" text-anchor="start">Awards &amp; Certifications</text>
<rect class="grow" x="83.6" y="106" width="337.38" height="2" rx="1" fill="url(#u)"/>
<circle cx="83.6" cy="107" r="2.5" fill="#e3b341" style="--d:337.38px;animation:travel 3.6s ease-in-out 1.2s infinite"/>
