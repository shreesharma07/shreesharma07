<svg xmlns="http://www.w3.org/2000/svg" width="560" height="268" viewBox="0 0 560 268" role="img" aria-label="PNA Push Notifications">
<title>PNA Push Notifications</title>
<style>
@font-face{font-family:'m6';src:url(data:font/woff2;base64,) format('woff2');}
.m6{font-family:'m6','JetBrains Mono',ui-monospace,monospace;font-weight:normal;}
@font-face{font-family:'d7';src:url(data:font/woff2;base64,) format('woff2');}
.d7{font-family:'d7','Space Grotesk',system-ui,sans-serif;font-weight:normal;}
@font-face{font-family:'m4';src:url(data:font/woff2;base64,) format('woff2');}
.m4{font-family:'m4','JetBrains Mono',ui-monospace,monospace;font-weight:normal;}
@font-face{font-family:'d5';src:url(data:font/woff2;base64,) format('woff2');}
.d5{font-family:'d5','Space Grotesk',system-ui,sans-serif;font-weight:normal;}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.rise{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.1s cubic-bezier(.2,.8,.2,1) both}
@media (prefers-reduced-motion:reduce){*{animation:none!important;}}
</style>
<defs></defs>
<rect x="8" y="16" width="52" height="52" rx="14" fill="#f0883e" fill-opacity=".12" stroke="#f0883e" stroke-opacity=".5"/>
<text x="34" y="48" class="m6 " font-size="17" fill="#f0883e" text-anchor="middle">#!</text>
<text x="80" y="40" class="d7 " font-size="24" fill="#e6edf3" text-anchor="start">PNA Push Notifications</text>
<text x="80" y="64" class="m4 " font-size="13" fill="#6e7681" text-anchor="start">PrepLadder · sole developer</text>
<text x="8" y="112" class="d5 " font-size="17" fill="#8b949e" text-anchor="start">Personalised payloads and send-time selection that improved</text>
<text x="8" y="137.5" class="d5 " font-size="17" fill="#8b949e" text-anchor="start">retention on a large EdTech platform.</text>
