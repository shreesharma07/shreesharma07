<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="152" viewBox="0 0 1200 152" role="img" aria-label="Thanks for visiting">
<title>Thanks for visiting</title>
<style>
@font-face{font-family:'m4';src:url(data:font/woff2;base64,) format('woff2');}
.m4{font-family:'m4','JetBrains Mono',ui-monospace,monospace;font-weight:normal;}
@font-face{font-family:'d6';src:url(data:font/woff2;base64,) format('woff2');}
.d6{font-family:'d6','Space Grotesk',system-ui,sans-serif;font-weight:normal;}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.rise{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes sweep{0%{transform:translateX(-300px)}100%{transform:translateX(1200px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;}}
</style>
<defs><clipPath id="fc"><rect y="40" width="1200" height="112" rx="16"/></clipPath><linearGradient id="fl" x1="0" x2="1"><stop offset="0" stop-color="#a371f7" stop-opacity="0"/><stop offset=".5" stop-color="#58a6ff"/><stop offset="1" stop-color="#a371f7" stop-opacity="0"/></linearGradient></defs>
<rect x="0.5" y="40.5" width="1199" height="111" rx="16" fill="#0d1117" stroke="#30363d"/>
<g clip-path="url(#fc)"><rect y="149" width="300" height="3" fill="url(#fl)" style="animation:sweep 4s linear infinite"/></g>
<text x="326.4" y="90" class="m4 " font-size="16" xml:space="preserve"><tspan fill="#6e7681">// </tspan><tspan fill="#8b949e">thanks for stopping by. </tspan><tspan fill="#e6edf3">let's build something reliable</tspan></text>
<text x="600" y="122" class="d6 " font-size="15" fill="#58a6ff" text-anchor="middle">shrikumarsharma.in</text>
</svg>