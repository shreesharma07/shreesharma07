<text x="211.33333333333334" y="214" class="d7 " font-size="26" fill="#f0883e" text-anchor="start">RDS</text>
<text x="211.33333333333334" y="240" class="m4 " font-size="12.5" fill="#6e7681" text-anchor="start">+ Cassandra</text>
